{% extends "base.html" %}

{% block title %}Check your email — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <div class="card bg-base-100 shadow-md">
      <div class="card-body">
        <h1 class="card-title text-2xl">Check your email</h1>
        <p>If an account exists with that email address, we've sent password-reset instructions. Please check your inbox and spam folder.</p>

        <p class="mt-4 text-center text-sm opacity-70">
          <a href="{% url 'accounts:login' %}" class="link link-primary">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>
{% endblock %}
